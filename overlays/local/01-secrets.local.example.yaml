apiVersion: v1
kind: Secret
metadata:
  name: event-hub-secrets
  namespace: event-hub
type: Opaque
stringData:
  MYSQL_PASSWORD: <set-mysql-password>
  MONGO_INITDB_ROOT_USERNAME: <set-mongo-initdb-root-username>
  MONGO_INITDB_ROOT_PASSWORD: <set-mongo-initdb-root-password>
  MONGO_URI: <set-mongo-uri>
  RABBITMQ_DEFAULT_USER: <set-rabbitmq-default-user>
  RABBITMQ_DEFAULT_PASS: <set-rabbitmq-default-pass>
  KEYCLOAK_CLIENT_SECRET: <set-keycloak-client-secret>
  KEYCLOAK_CONFIG_NAME: <set-keycloak-config-name>
  KEYCLOAK_CONFIG_PASSWORD: <set-keycloak-config-password>
  CONFIG_GIT_USERNAME: <set-config-git-username>
  CONFIG_GIT_PASSWORD: <set-config-git-password>
  AWS_ACCESS_KEY_ID: <set-aws-access-key-id>
  AWS_SECRET_ACCESS_KEY: <set-aws-secret-access-key>
  BREVO_API_KEY: <set-brevo-api-key>
  BREVO_SENDER_EMAIL: <set-brevo-sender-email>
  BREVO_SENDER_NAME: <set-brevo-sender-name>
