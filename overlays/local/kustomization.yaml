apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: event-hub
resources:
  - ../../base
patches:
  - path: configmap-patch.yaml
  - path: spring-profile-patch.yaml
    target:
      kind: Deployment
      name: (eureka-server|auth-service|event-service|booking-service|gateway-service)
  - path: keycloak-management-patch.yaml
