apiVersion: v1
kind: ConfigMap
metadata:
  name: event-hub-config
  namespace: event-hub
data:
  EUREKA_URL: http://eureka-server:8761/eureka/
  CONFIG_SERVER_URL: http://config-server:8888
  CONFIG_GIT_URI: https://github.com/eventTicket-booking-platform/config-repo.git
  CONFIG_GIT_LABEL: main
  MYSQL_PORT: "3306"
  MYSQL_USERNAME: root
  KEYCLOAK_REALM: ec7205
  KEYCLOAK_CLIENT_ID: ec7205-client
  KEYCLOAK_GRANT_TYPE: password
  AWS_REGION: us-east-1
  AWS_BUCKET_NAME: ec7205-event-booking
  AUTH_NOTIFICATION_QUEUE: auth.notification.queue
  BOOKING_NOTIFICATION_QUEUE: booking.notification.queue
  NEXT_PUBLIC_API_BASE_URL: ""
  SERVER_API_BASE_URL: http://gateway-service:9090/api
  SERVER_EVENTS_API_BASE_URL: http://event-service:9091
  API_BASE_URL: /api
